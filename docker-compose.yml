services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: assessor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: assessor
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://assessor:${POSTGRES_PASSWORD}@db:5432/assessor
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER}
      JWT_SECRET: ${JWT_SECRET}
      # Encrypts the two-step-verification secrets. Define it once and never change it; empty = falls back to JWT_SECRET.
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      WEB_URL: ${WEB_URL}
      # Optional: public address of this API (WhatsApp delivery callbacks, report links) and the approved
      # Twilio template used by the weekly summary outside the 24h window. Empty = not set.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      TWILIO_SUMMARY_TEMPLATE_SID: ${TWILIO_SUMMARY_TEMPLATE_SID:-}
      # Heeca portal integration (provision, entitlement, SSO). Empty secret = integration off.
      HEECA_PLATFORM_SECRET: ${HEECA_PLATFORM_SECRET:-}
      HEECA_PORTAL_URL: ${HEECA_PORTAL_URL:-}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
      PORT: 3001
    depends_on:
      - db

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      API_URL: http://api:3001
      HEECA_PORTAL_URL: ${HEECA_PORTAL_URL:-}
    depends_on:
      - api

volumes:
  db_data:
