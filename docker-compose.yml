services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: assessor
      POSTGRES_PASSWORD: assessor
      POSTGRES_DB: assessor
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: ./apps/api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://assessor:assessor@db:5432/assessor
    ports:
      - "3001:3001"
    depends_on:
      - db

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      API_URL: http://api:3001
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db_data:
